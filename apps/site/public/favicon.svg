<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 512 512"
     width="512"
     height="512"
     role="img"
     aria-labelledby="puzzle-logo-title puzzle-logo-desc">
  <title id="puzzle-logo-title">Puzzle UI</title>
  <desc id="puzzle-logo-desc">A four-piece puzzle mark in blue, purple, teal and orange, with a white central opening.</desc>

  <defs>
    <linearGradient id="puzzle-blue" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2787ff"/>
      <stop offset="1" stop-color="#0768df"/>
    </linearGradient>
    <linearGradient id="puzzle-purple" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#7b2cf5"/>
      <stop offset="1" stop-color="#4a13d3"/>
    </linearGradient>
    <linearGradient id="puzzle-teal" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2bcaa9"/>
      <stop offset="1" stop-color="#008f83"/>
    </linearGradient>
    <linearGradient id="puzzle-orange" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#ffbd22"/>
      <stop offset="1" stop-color="#ff501d"/>
    </linearGradient>
    <filter id="logo-shadow" x="-12%" y="-12%" width="124%" height="132%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offset-blur"/>
      <feComponentTransfer in="offset-blur" result="shadow">
        <feFuncA type="linear" slope="0.19"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

