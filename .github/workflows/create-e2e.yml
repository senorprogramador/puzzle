name: Create E2E

on:
  push:
    branches:
      - main
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/create-e2e.yml"
  pull_request:
    paths:
      - "packages/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/create-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Generated projects
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run generated project end-to-end tests
        run: bun run test:e2e
