name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment of the site"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run all package tests
        run: bun run test:all

      - name: Build documentation site
        run: bun run --filter '@puzzle-ui/site' build

  changes:
    name: Detect website changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      site: ${{ steps.filter.outputs.site }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - 'apps/site/**'
              - 'packages/core/**'
              - 'packages/hooks/**'
              - 'packages/icons/**'
              - 'packages/theme/**'
              - 'packages/ui/**'
              - 'packages/pieces/**'
              - 'package.json'
              - 'bun.lock'
              - 'Dockerfile'
              - '.dockerignore'

  deploy-site:
    name: Build & Deploy Puzzle website
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - test
      - changes

    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.test.result == 'success' &&
          needs.changes.outputs.site == 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.force_deploy == true
        )
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -t puzzle-site:${{ github.sha }} \
            .

      - name: Export Docker image
        run: |
          mkdir -p docker-images

          docker save puzzle-site:${{ github.sha }} \
            -o docker-images/puzzle-site.tar

          chmod -R a+r docker-images

      - name: Upload Docker image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-images/puzzle-site.tar
          target: /deploy

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            echo "Loading Puzzle Docker image..."
            docker load -i /deploy/docker-images/puzzle-site.tar

            echo "Updating server configuration..."
            cd /opt
            git pull --ff-only

            echo "Deploying Puzzle..."
            cd /opt/sites/puzzle-ui.com

            IMAGE_TAG=${{ github.sha }} \
              docker compose up -d --no-deps --force-recreate puzzle-site

            echo "Puzzle deployment complete!"
