name: CI & Deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Force deployment of the site"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Check dependency specifications
        run: bun run check:dependency-specs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check component registry
        run: bun run registry:check

      - name: Check API stability labels
        run: bun run api-stability:check

      - name: Build packages
        run: bun run build

      - name: Validate AI instruction package tarballs
        run: bun run --filter '@puzzle-ui/create' ai:check

      - name: Typecheck workspace
        run: bun run typecheck

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
        working-directory: packages/fullstack

      - name: Run workspace and homepage theme tests
        run: bun run test:all:node

      - name: Run site SEO unit tests
        run: bun run --filter '@puzzle-ui/site' test:seo

      - name: Run rendered site SEO smoke checks
        run: bun run --filter '@puzzle-ui/site' test:seo:smoke

      - name: Upload homepage theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-theme-screenshots-node-${{ matrix.node-version }}
          path: apps/site/test-results/homepage-theme/
          if-no-files-found: warn

  visual:
    name: Visual regression (Playwright ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:56be08aca06bf736a928da2e3235a3b63ef71ee97313beb18c6019fea791aba4
      options: --platform linux/arm64 --shm-size=1gb
    env:
      PUZZLE_VISUAL_ENVIRONMENT: playwright-1.65.1-ubuntu-24.04-arm64-chromium-159.0.8154.6-bun-1.4.4
      PUZZLE_PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:56be08aca06bf736a928da2e3235a3b63ef71ee97313beb18c6019fea791aba4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pinned Bun
        run: npm install --global --allow-scripts=bun bun@1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build workspace packages
        run: bun run build

      - name: Build reference site
        run: bun run build
        working-directory: apps/playground

      - name: Report and verify visual environment
        run: bun run test:visual:diagnostics:container
        working-directory: apps/playground

      - name: Prepare reference-site test results
        run: mkdir -p test-results
        working-directory: apps/playground

      - name: Run reference-site behavioral tests
        run: bun run test:reference:behavior:container 2>&1 | tee test-results/reference-site-behavior.log
        working-directory: apps/playground
        env:
          PUZZLE_REFERENCE_SCREENSHOT_DIR: ./test-results/reference-site-captures

      - name: Run accessibility browser tests
        run: bun run test:a11y:container
        working-directory: apps/playground

      - name: Run visual regression tests
        run: bun run test:visual:container
        working-directory: apps/playground

      - name: Upload reference-site Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-site-playwright-results
          path: apps/playground/test-results/
          if-no-files-found: warn

  changes:
    name: Detect website changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      site: ${{ steps.filter.outputs.site }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            site:
              - 'apps/site/**'
              - 'packages/core/**'
              - 'packages/hooks/**'
              - 'packages/icons/**'
              - 'packages/theme/**'
              - 'packages/ui/**'
              - 'packages/pieces/**'
              - 'packages/seo/**'
              - 'package.json'
              - 'bun.lock'
              - 'Dockerfile'
              - '.dockerignore'

  deploy-site:
    name: Build & Deploy Puzzle website
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs:
      - test
      - visual
      - changes

    if: |
      always() &&
      (
        (
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          needs.test.result == 'success' &&
          needs.visual.result == 'success' &&
          needs.changes.outputs.site == 'true'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          inputs.force_deploy == true
        )
      )

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Record manual deployment override
        if: github.event_name == 'workflow_dispatch' && inputs.force_deploy == true
        run: |
          echo "Manual deployment override requested; CI=${{ needs.test.result }}, visual=${{ needs.visual.result }}." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Build Docker image
        run: |
          docker build \
            --pull \
            -t puzzle-site:${{ github.sha }} \
            .

      - name: Export Docker image
        run: |
          mkdir -p docker-images

          docker save puzzle-site:${{ github.sha }} \
            -o docker-images/puzzle-site.tar

          chmod -R a+r docker-images

      - name: Upload Docker image to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-images/puzzle-site.tar
          target: /deploy

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            echo "Loading Puzzle Docker image..."
            docker load -i /deploy/docker-images/puzzle-site.tar

            echo "Updating server configuration..."
            cd /opt
            git pull --ff-only

            echo "Deploying Puzzle..."
            cd /opt/sites/puzzle-ui.com

            IMAGE_TAG=${{ github.sha }} \
              docker compose up -d --no-deps --force-recreate puzzle-site

            echo "Puzzle deployment complete!"
