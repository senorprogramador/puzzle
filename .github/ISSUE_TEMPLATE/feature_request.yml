name: Feature request
description: Propose a capability or improvement for Puzzle UI.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: For large or cross-package changes, start a discussion before implementation.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or use case should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: Describe the outcome you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What alternatives or workarounds have you considered?
    validations:
      required: false
  - type: input
    id: affected-package
    attributes:
      label: Affected package
      description: Name a package if known, or enter "uncertain".
      placeholder: "@puzzle-ui/ui"
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Examples, links, or constraints that may help evaluate the request.
    validations:
      required: false
