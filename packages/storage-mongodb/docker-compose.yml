services:
  mongodb:
    image: mongo:8.0
    container_name: puzzle-storage-mongodb
    command:
      - mongod
      - --replSet
      - rs0
      - --bind_ip_all
    ports:
      - "27017:27017"
    volumes:
      - puzzle-mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - db.adminCommand('ping').ok
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

volumes:
  puzzle-mongodb-data:
